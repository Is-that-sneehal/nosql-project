{% extends "base.html" %}

{% block title %}Edit Article - Admin{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto my-8 bg-slate-900/80 border border-slate-800 p-8 rounded-3xl shadow-2xl">
  <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
    <div>
      <h1 class="text-xl font-bold text-white">Edit Article</h1>
      <p class="text-xs text-slate-400 mt-1">Updating content will automatically clear any cached summary from Redis.</p>
    </div>
    <a href="{{ url_for('admin_articles') }}" class="text-xs text-indigo-400 hover:underline font-semibold">
      &larr; Back to Articles
    </a>
  </div>

  <form method="POST" action="{{ url_for('admin_edit_article', article_id=article._id) }}" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Article Title *</label>
      <input type="text" name="title" value="{{ article.title }}" required
        class="w-full px-3.5 py-2 bg-slate-950/80 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Source / Publication</label>
      <input type="text" name="source" value="{{ article.source or '' }}"
        class="w-full px-3.5 py-2 bg-slate-950/80 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Content (Plain Text) *</label>
      <textarea name="content_text" rows="12" required
        class="w-full px-3.5 py-2 bg-slate-950/80 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition font-mono">{{ article.content_text }}</textarea>
    </div>

    <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
      <a href="{{ url_for('admin_articles') }}"
        class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-semibold transition">
        Cancel
      </a>
      <button type="submit"
        class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs shadow-md shadow-indigo-600/30 transition">
        Save Changes
      </button>
    </div>
  </form>
</div>
{% endblock %}
