{% extends "base.html" %}

{% block title %}Register - Aetheria Library{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-slate-900/80 border border-slate-800 p-8 rounded-3xl shadow-2xl backdrop-blur-sm">
  <div class="text-center mb-8">
    <div class="w-12 h-12 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl font-bold">
      📝
    </div>
    <h1 class="text-2xl font-extrabold text-white tracking-tight">Create an Account</h1>
    <p class="text-xs text-slate-400 mt-1">Join to explore and read library collections</p>
  </div>

  <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1.5">Full Name</label>
      <input type="text" name="name" required placeholder="John Doe"
        class="w-full px-3.5 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email Address</label>
      <input type="email" name="email" required placeholder="john@example.com"
        class="w-full px-3.5 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
      <input type="password" name="password" required placeholder="••••••••" minlength="4"
        class="w-full px-3.5 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1.5">Role</label>
      <select name="role"
        class="w-full px-3.5 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        <option value="member" selected>Member (Browse, Translate & Summarize)</option>
        <option value="admin">Admin (Manage Catalog)</option>
      </select>
    </div>

    <button type="submit"
      class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs tracking-wide shadow-lg shadow-indigo-600/30 transition">
      Create Account
    </button>
  </form>

  <p class="text-center text-xs text-slate-400 mt-6">
    Already have an account? <a href="{{ url_for('login') }}" class="text-indigo-400 hover:underline font-semibold">Sign in here</a>
  </p>
</div>
{% endblock %}
